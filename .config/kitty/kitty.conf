# ===== Appearance =====
font_family FiraCode
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0
adjust_line_height 0
adjust_column_width 0

# ===== Opacity / Background =====
background_opacity 0.85
background #1e1328
foreground #f7e3d8

# ===== Cursor =====
cursor #ff6f61
cursor_shape block

# ===== Selection =====
selection_foreground #1e1328
selection_background #ff9b6b

# ===== FreeBSD-Inspired Color Scheme =====
color0  #1e1328
color1  #ff6f61
color2  #4e9a06
color3  #c4a000
color4  #3465a4
color5  #75507b
color6  #06989a
color7  #f7e3d8
color8  #555753
color9  #ff6f61
color10 #8ae234
color11 #fce94f
color12 #729fcf
color13 #ad7fa8
color14 #34e2e2
color15 #ffffff

# ===== Window Behavior =====
confirm_os_window_close 0
enable_audio_bell no
bell_on_tab yes
window_padding_width 8
